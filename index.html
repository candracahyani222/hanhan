<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Mission: Jadi Pacar Terbaik — Layered Pixel Game</title>
<style>
*{box-sizing:border-box}
:root{--tile:64px}
html,body{margin:0;background:#100b16;color:#fff;font-family:system-ui,sans-serif;height:100%;overflow:hidden}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#7f9b69}
#world{position:absolute;width:2400px;height:1600px;left:50%;top:50%;transform:translate(-50%,-50%);transition:transform .08s linear}
.layer{position:absolute;inset:0;background-repeat:repeat;background-size:128px 128px}
#ground{background-image:url("assets/ground.svg")}
#water{left:160px;top:220px;width:760px;height:300px;inset:auto;background-image:url("assets/water.svg");background-size:128px 128px;animation:waterMove 5s linear infinite}
@keyframes waterMove{from{background-position:0 0}to{background-position:128px 0}}
.obj{position:absolute;background-repeat:no-repeat;background-size:contain;image-rendering:auto;transform-origin:50% 90%}
.tree{width:150px;height:150px;background-image:url("assets/tree.svg");animation:sway 3.2s ease-in-out infinite}
.tree.t2{animation-delay:-1.1s}.tree.t3{animation-delay:-2s}
@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.5deg)}}
.house{width:270px;height:270px;background-image:url("assets/house.svg")}
.camp{width:150px;height:150px;background-image:url("assets/campfire.svg");animation:fire .5s steps(2) infinite}
@keyframes fire{0%,100%{transform:scale(1)}50%{transform:scale(1.04) translateY(-2px)}}
.flower{width:65px;height:65px;background-image:url("assets/flower.svg");animation:flower 2.5s ease-in-out infinite}
@keyframes flower{50%{transform:rotate(3deg)}}
.sign{width:150px;height:150px;background-image:url("assets/sign.svg")}
#clouds{position:absolute;inset:0;pointer-events:none}
.cloud{position:absolute;width:240px;height:70px;border-radius:70px;background:#f7eadb33;filter:blur(1px);animation:cloud 28s linear infinite}
@keyframes cloud{from{transform:translateX(-300px)}to{transform:translateX(2600px)}}
#character{position:absolute;width:90px;height:130px;background-size:contain;background-repeat:no-repeat;background-position:center;z-index:20;transition:background-image .12s}
#shadow{position:absolute;width:55px;height:14px;border-radius:50%;background:#2e413b55;z-index:19}
.hotspot{position:absolute;z-index:18;border:2px solid transparent;background:transparent;cursor:pointer;border-radius:16px}
.hotspot:hover{border-color:#ffe0a766;background:#fff1c30d}
#hud{position:fixed;z-index:50;left:14px;top:14px;background:#24192bcc;border:2px solid #d39a8c;border-radius:16px;padding:12px 14px;backdrop-filter:blur(5px)}
#hud b{color:#ffd68e}
#help{position:fixed;z-index:50;right:14px;top:14px;background:#24192bcc;border:2px solid #d39a8c;border-radius:16px;padding:10px 12px;font-size:12px}
#dialog{position:fixed;z-index:100;left:50%;bottom:22px;transform:translateX(-50%);width:min(760px,calc(100vw - 28px));background:#f5dfc4;color:#3a2529;border:4px solid #744b4c;border-radius:18px;padding:18px;box-shadow:0 18px 60px #0008;display:none}
#dialog .speaker{font-weight:900;color:#9b4e5a;margin-bottom:5px}
#dialog button{margin-top:10px;border:2px solid #96565d;background:#e5a09d;border-radius:10px;padding:9px 16px;font-weight:800}
#modal{position:fixed;inset:0;background:#110a16d9;z-index:200;display:none;place-items:center;padding:16px}
.panel{width:min(620px,100%);background:#f5dfc4;color:#3a2529;border:4px solid #744b4c;border-radius:20px;padding:22px;box-shadow:0 20px 70px #000}
.panel h2{margin:0;color:#914752}.q{font-size:20px;font-weight:800;margin:14px 0}.answers{display:grid;gap:9px}.answer{border:2px solid #96565d;background:#e5a09d;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}.answer:hover{filter:brightness(1.08);transform:translateY(-1px)}
#status{min-height:26px;font-weight:900;margin-top:12px}.close{margin-top:10px;border:2px solid #96565d;background:#d78b8e;border-radius:10px;padding:10px 15px;font-weight:800}
@media(max-width:600px){#help{top:auto;bottom:14px;right:14px}.world{transform:scale(.8)}}
</style>
</head>
<body>
<div id="game">
  <div id="world">
    <div id="ground" class="layer"></div>
    <div id="water" class="layer"></div>
    <div id="clouds"><div class="cloud" style="top:120px;left:-250px"></div><div class="cloud" style="top:340px;left:600px;animation-delay:-12s"></div></div>

    <div class="obj house" style="left:820px;top:270px"></div>
    <div class="obj house" style="left:1480px;top:760px;transform:scale(.82)"></div>
    <div class="obj camp" style="left:1160px;top:940px"></div>
    <div class="obj sign" style="left:1090px;top:500px"></div>

    <div class="obj tree" style="left:270px;top:140px"></div>
    <div class="obj tree t2" style="left:560px;top:270px"></div>
    <div class="obj tree t3" style="left:1280px;top:210px"></div>
    <div class="obj tree" style="left:1760px;top:260px"></div>
    <div class="obj tree t2" style="left:420px;top:1000px"></div>
    <div class="obj tree t3" style="left:1840px;top:990px"></div>
    <div class="obj tree" style="left:720px;top:1110px"></div>
    <div class="obj tree t2" style="left:1520px;top:1120px"></div>

    <div class="obj flower" style="left:770px;top:600px"></div>
    <div class="obj flower" style="left:880px;top:640px;animation-delay:-1s"></div>
    <div class="obj flower" style="left:1350px;top:700px;animation-delay:-.4s"></div>
    <div class="obj flower" style="left:1600px;top:520px;animation-delay:-1.6s"></div>

    <button class="hotspot" style="left:800px;top:260px;width:320px;height:290px" onclick="openMission(0)"></button>
    <button class="hotspot" style="left:1420px;top:730px;width:330px;height:300px" onclick="openMission(1)"></button>
    <button class="hotspot" style="left:1080px;top:880px;width:280px;height:240px" onclick="talkCamp()"></button>

    <div id="shadow"></div>
    <div id="character"></div>
  </div>
</div>

<div id="hud">❤️ <b id="hearts">3</b> &nbsp; • &nbsp; ⭐ <b id="score">0</b></div>
<div id="help">WASD / tombol panah untuk jalan<br>Tap rumah, api unggun, atau objek yang menyala</div>

<div id="dialog">
  <div class="speaker" id="speaker">AKU</div>
  <div id="dialogText"></div>
  <button onclick="closeDialog()">Lanjut</button>
</div>

<div id="modal">
  <div class="panel">
    <div id="counter">MISSION 1 / 3</div>
    <h2 id="title"></h2>
    <div class="q" id="question"></div>
    <div class="answers" id="answers"></div>
    <div id="status"></div>
    <button class="close" onclick="closeModal()">Kembali ke dunia</button>
  </div>
</div>

<script>
const world=document.getElementById("world");
const char=document.getElementById("character");
const shadow=document.getElementById("shadow");
let px=1080,py=650,speed=4,frame=0,dir=1,moving=false;
let state=JSON.parse(localStorage.getItem("layeredPacarGame")||'{"score":0,"hearts":3,"unlocked":1}');
const frames=["assets/boy0.svg","assets/boy1.svg","assets/boy2.svg","assets/boy3.svg"];
const keys={};

const missions=[
  {title:"Rumah Kenangan",q:"Kalau aku sedang bad mood, apa yang paling aku butuhkan?",a:["Diceramahin","Ditinggal","Dipahami dan ditemani","Disuruh tidur"],c:2},
  {title:"Rumah Kedua",q:"Kalau aku bilang 'terserah', pilihan paling aman adalah...",a:["Benar-benar terserah","Cari tahu sebenarnya aku mau apa","Pilih sendiri","Ganti topik"],c:1},
  {title:"Api Unggun Rahasia",q:"Setelah semua misi selesai, hadiah sebenarnya adalah...",a:["Uang","Mobil","Aku tetap sayang kamu","Voucher"],c:2}
];

function save(){localStorage.setItem("layeredPacarGame",JSON.stringify(state));updateHud()}
function updateHud(){document.getElementById("score").textContent=state.score;document.getElementById("hearts").textContent=state.hearts}
function setChar(){char.style.backgroundImage=`url("${frames[frame]}")`}
function move(){
  let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);
  let dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
  moving=!!(dx||dy);
  if(!moving)return;
  if(dx)dir=dx;
  const len=Math.hypot(dx,dy)||1; px=Math.max(70,Math.min(2320,px+dx/len*speed));py=Math.max(80,Math.min(1450,py+dy/len*speed));
  frame=(frame+0.35)%4|0;setChar();
}
function camera(){
  const cx=innerWidth/2,cy=innerHeight/2;
  const tx=cx-px,ty=cy-py;
  world.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px))`;
  char.style.left=px-45+"px";char.style.top=py-125+"px";
  shadow.style.left=px-28+"px";shadow.style.top=py-6+"px";
}
function loop(){move();camera();requestAnimationFrame(loop)}
window.addEventListener("keydown",e=>{keys[e.key]=true});
window.addEventListener("keyup",e=>{keys[e.key]=false});
setChar();updateHud();loop();

function showDialog(text,speaker="AKU"){document.getElementById("speaker").textContent=speaker;document.getElementById("dialogText").textContent=text;document.getElementById("dialog").style.display="block"}
function closeDialog(){document.getElementById("dialog").style.display="none"}
function talkCamp(){showDialog("Kamu sampai juga. Api ini baru akan menyala penuh kalau semua misi selesai. Jangan menyerah ya.","AKU")}
function openMission(i){
  if(i+1>state.unlocked){showDialog("Tempat ini masih terkunci. Selesaikan misi sebelumnya dulu.","GAME");return}
  document.getElementById("modal").style.display="grid";
  document.getElementById("counter").textContent=`MISSION ${i+1} / 3`;
  document.getElementById("title").textContent=missions[i].title;
  document.getElementById("question").textContent=missions[i].q;
  document.getElementById("status").textContent="";
  const box=document.getElementById("answers");box.innerHTML="";
  missions[i].a.forEach((x,n)=>{const b=document.createElement("button");b.className="answer";b.textContent=x;b.onclick=()=>answer(i,n);box.appendChild(b)})
}
function answer(i,n){
  const m=missions[i],st=document.getElementById("status");
  if(n===m.c){
    state.score+=100;state.unlocked=Math.max(state.unlocked,i+2);save();
    st.textContent="✓ Misi selesai. Dunia baru terbuka.";
    st.style.color="#3d7b50";
    setTimeout(()=>{document.getElementById("modal").style.display="none";showDialog(i===2?"Semua misi selesai. Jalan ke api unggun... ada sesuatu untukmu.":"Bagus. Coba jalan-jalan lagi. Ada tempat baru yang menunggu.","AKU")},650);
  }else{
    state.hearts--;if(state.hearts<=0)state.hearts=3;save();
    st.textContent="Belum tepat. Coba lagi.";
    st.style.color="#a44755";
  }
}
function closeModal(){document.getElementById("modal").style.display="none"}
</script>
</body>
</html>
